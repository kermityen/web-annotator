<!doctype html>
<html><head><meta charset="utf-8"><title>Test Article</title>
<script>
// A hostile page: capture-phase listeners on window, document and <html>, registered as early as
// a page script can run. Everything typed anywhere on the page is logged.
window.__log = '';
const log = (e) => {
  window.__log += (e.key || '') + (e.data || '') + (e.clipboardData ? e.clipboardData.getData('text') : '') + '|';
};
const TYPES = ['keydown', 'keyup', 'keypress', 'beforeinput', 'input', 'textInput',
  'compositionstart', 'compositionupdate', 'compositionend', 'paste', 'copy', 'cut'];
for (const t of TYPES) {
  window.addEventListener(t, log, true);
  document.addEventListener(t, log, true);
  document.documentElement.addEventListener(t, log, true);
}
</script>
<style>body{font:16px/1.6 sans-serif;margin:40px;max-width:700px}</style>
</head><body>
<h1>Test Article</h1>
<p id="p1">The quick brown fox jumps over the lazy dog near the riverbank.</p>
<textarea id="own" rows="2"></textarea>
</body></html>
